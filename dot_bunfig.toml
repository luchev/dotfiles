# Bun does not pick up the `_auth` line in ~/.npmrc, so `bun install` gets 401
# from the private registry while npm works from the same file. Credentials are
# interpolated from the environment — set UNPM_USER / UNPM_PASS in
# ~/.config-local.nu (untracked), never here; this repo is public.
#
# If bun starts 401ing again, check those vars are exported first: an unset
# $VAR interpolates to empty and looks identical to a missing credential.

[install.registry]
url = "https://registry.internal.example/"
username = "$UNPM_USER"
password = "$UNPM_PASS"
