# dotbot config — symlinks dotfiles from this repo into $HOME.
#   ./install                 links + core setup
#   ./install --packages      also installs packages (setup/packages/*)
#
# force: true replaces the real files chezmoi previously copied in. Content is
# byte-identical to the repo, so this only swaps a copy for a symlink.

- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ['~', '~/.config', '~/.claude', '~/.config/opencode', '~/.config/nushell']

- link:
    # ── shell / editors ──────────────────────────────────────────────────
    ~/.zshrc: zshrc
    ~/.profile: profile
    ~/.vimrc: vimrc
    ~/.tmux.conf: tmux.conf
    ~/.wezterm.lua: wezterm.lua
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.gitmessage: gitmessage

    # ── ~/.config single files ───────────────────────────────────────────
    ~/.config/starship.toml: config/starship.toml
    ~/.opencode/rate-limit-fallback.json: config/opencode/rate-limit-fallback.json

    # ── nvim (whole dir; nvim writes lazy-lock.json back into the repo) ──
    ~/.config/nvim: config/nvim

    # ── lazy-mcp ─────────────────────────────────────────────────────────
    ~/.config/lazy-mcp: config/lazy-mcp

    # ── nushell (granular: leaves local.nu / history.txt untouched) ──────
    ~/.config/nushell/config.nu: config/nushell/config.nu
    ~/.config/nushell/env.nu: config/nushell/env.nu
    ~/.config/nushell/init-env.nu: config/nushell/init-env.nu
    ~/.config/nushell/themes: config/nushell/themes
    ~/.config/nushell/sync-env-from-bitwarden.sh: config/nushell/sync-env-from-bitwarden.sh
    ~/.config/nushell/sync-ssh-from-bitwarden.sh: config/nushell/sync-ssh-from-bitwarden.sh

    # ── zellij (granular: leaves the downloaded plugins/ dir untouched) ──
    ~/.config/zellij/config.kdl: config/zellij/config.kdl
    ~/.config/zellij/layouts: config/zellij/layouts

    # ── opencode (granular: leaves node_modules, agents, opencode.json …) ─
    ~/.config/opencode/instructions.md: config/opencode/instructions.md
    ~/.config/opencode/dcp.jsonc: config/opencode/dcp.jsonc
    # tui.json: NOT symlinked — aifx agent run overwrites it on every launch.
    # Personal plugins (session-surf, copy-message) are injected by the opencode
    # shim in ~/.dotfiles-work/bin/opencode after aifx writes its enforced config.
    ~/.config/opencode/statusline-command.sh: config/opencode/statusline-command.sh
    ~/.config/opencode/command: config/opencode/command
    ~/.config/opencode/prompts/verify.txt: config/opencode/prompts/verify.txt
    ~/.config/opencode/skills: config/opencode/skills

    # ── opencode-personal: config dir used by bin/opencode (OPENCODE_CONFIG_DIR)
    # Keeps the aifx/work config out. instructions.md and skills still resolve
    # through ~/.config/opencode/* above, which are personal symlinks.
    ~/.config/opencode-personal/opencode.jsonc: config/opencode/opencode.jsonc
    ~/.config/opencode-personal/tui.json: config/opencode/tui.json

    # ── claude (settings.json + cross-symlinks handled in shell:) ────────
    ~/.claude/hooks: claude/hooks
    ~/.claude/output-styles: claude/output-styles
    ~/.claude/rules: claude/rules

    # ── work board (granular: data/ is local, collect.sh comes from the
    #    work dotfiles, so the dir itself must not be a symlink) ──────────
    ~/.claude/dashboard/index.html: config/workboard/index.html
    ~/.claude/dashboard/serve.sh: config/workboard/serve.sh
    ~/.claude/dashboard/feed.sh: config/workboard/feed.sh
    ~/.claude/dashboard/collect-oncall.py: config/workboard/collect-oncall.py
    ~/.claude/dashboard/collect-reviews.py: config/workboard/collect-reviews.py
    ~/.claude/dashboard/README.md: config/workboard/README.md
    ~/.claude/dashboard/fonts: config/workboard/fonts

    # ── misc dot dirs ────────────────────────────────────────────────────
    # ~/.omo holds opencode runtime (session state, cached binaries); link only
    # the tracked config file, leave the rest of the dir alone.
    ~/.omo/omo.jsonc: omo/omo.jsonc
    ~/.pi: pi
    ~/.termux: termux

    # ── ghostty (macOS Application Support); granular to keep config.ghostty ─
    ~/Library/Application Support/com.mitchellh.ghostty/config: Library/Application Support/com.mitchellh.ghostty/config
    ~/Library/Application Support/com.mitchellh.ghostty/shaders: Library/Application Support/com.mitchellh.ghostty/shaders

    # ── ~/bin scripts (individual: ~/bin holds unmanaged tools too) ──────
    ~/bin/claude-mem-refresh-token.sh: bin/claude-mem-refresh-token.sh
    ~/bin/mem-migrate.py: bin/mem-migrate.py

    # ── ~/.bin (on PATH in both zshrc and config.nu) ─────────────────────
    ~/.bin/ralph: bin/ralph

    # ── ~/.local/bin (first on PATH). The work repo installs its aifx shim as
    # `opencode-work`, so plain `opencode` stays personal either install order.
    ~/.local/bin/opencode: bin/opencode

- shell:
    - command: setup/merge-claude-settings.sh
      description: Merge personal keys into ~/.claude/settings.json
      stdout: true
      stderr: true
      stdout: true
    - command: setup/claude-symlinks.sh
      description: Cross-symlink ~/.claude/{CLAUDE.md,skills} to opencode
      stdout: true
    - command: setup/nushell-symlinks.sh
      description: Dual-link nushell config into ~/Library/Application Support
      stdout: true
    - command: setup/gen-zellij-workspace.sh
      description: Generate ~/.zellij-workspace from layouts
      stdout: true
    - command: setup/integrations.sh
      description: zoxide/atuin/argc init, local config stubs
      stdout: true
      stderr: true
    - command: setup/claude-mem-token.sh
      description: Refresh claude-mem gateway token (no-op without config)
      stdout: true
    - command: setup/bunfig.sh
      description: Generate ~/.bunfig.toml (only if NPM_REGISTRY_URL set)
      stdout: true
